# Labels pull requests by the files they touch. Uses pull_request_target so it also works on forks; it only reads
# the labeler config from the base branch and never runs code from the pull request.
name: Label pull requests
on:
  pull_request_target:
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
